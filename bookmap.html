<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Silent Trader - MT5 XAUUSD Synthetic Bookmap</title>
  <style>
    :root {
      --bg: #070b12;
      --panel: #0e1522;
      --border: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --buy: #22c55e;
      --sell: #ef4444;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      font-size: 13px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
    }
    .badge {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
    }
    .dot.live { background: var(--buy); box-shadow: 0 0 8px var(--buy); }
    .dot.err { background: var(--sell); }
    .price-box {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
    }
    .bid-txt { color: var(--buy); font-weight: 700; }
    .ask-txt { color: var(--sell); font-weight: 700; }
    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    input[type="text"] {
      background: #09101d;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      width: 220px;
    }
    button, input[type="range"] {
      background: #162033;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 9px;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent);
      color: #fff;
    }
    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
    }
    .canvas-wrap {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .legend {
      position: absolute;
      left: 12px;
      bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(7, 11, 18, 0.82);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      color: var(--muted);
      pointer-events: none;
    }
    .grad {
      width: 90px;
      height: 8px;
      border-radius: 4px;
      background: linear-gradient(90deg, #091326, #1d4ed8, #06b6d4, #eab308, #f97316, #ef4444);
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <span>SILENT TRADER</span>
      <span id="symBadge" class="badge">XAUUSD • MT5 SYNTHETIC</span>
      <div class="status">
        <span id="statusDot" class="dot"></span>
        <span id="statusText">Chờ kết nối MT5</span>
      </div>
    </div>

    <div class="price-box">
      <span>BID: <span id="bidVal" class="bid-txt">--</span></span>
      <span>ASK: <span id="askVal" class="ask-txt">--</span></span>
      <span>SPREAD: <span id="spreadVal">--</span></span>
    </div>

    <div class="controls">
      <input id="apiUrlInput" type="text" placeholder="URL Server / Tunnel (mặc định cùng trang)" />
      <button id="btnMT5" class="active">MT5 Synthetic</button>
      <button id="btnBinance">Binance PAXG</button>
      <button id="btnSim">Demo Sim</button>
      <div class="ctrl-group">
        <button id="zoomOut">-</button>
        <button id="zoomIn">+</button>
      </div>
      <div class="ctrl-group">
        <span>Heat:</span>
        <input id="heatRange" type="range" min="4" max="30" value="12" style="width:65px;padding:0;" />
      </div>
      <button id="btnCenter">Center</button>
      <button id="btnClear">Clear</button>
    </div>
  </div>

  <div class="canvas-wrap">
    <canvas id="bookmapCanvas"></canvas>
    <div class="legend">
      <span>Thanh khoản thấp</span>
      <div class="grad"></div>
      <span id="legendLabel">Liquidity Pool (Swing + Round + Tick)</span>
      <span>|</span>
      <span style="color:#22c55e;">● Buy Burst</span>
      <span style="color:#ef4444;">● Sell Burst</span>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('bookmapCanvas');
    const ctx = canvas.getContext('2d');

    const symBadge = document.getElementById('symBadge');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const bidVal = document.getElementById('bidVal');
    const askVal = document.getElementById('askVal');
    const spreadVal = document.getElementById('spreadVal');
    const apiUrlInput = document.getElementById('apiUrlInput');
    const heatRange = document.getElementById('heatRange');
    const legendLabel = document.getElementById('legendLabel');

    const btnMT5 = document.getElementById('btnMT5');
    const btnBinance = document.getElementById('btnBinance');
    const btnSim = document.getElementById('btnSim');
    const btnCenter = document.getElementById('btnCenter');
    const btnClear = document.getElementById('btnClear');
    const zoomIn = document.getElementById('zoomIn');
    const zoomOut = document.getElementById('zoomOut');

    const DEFAULT_TUNNEL = 'https://ash-end-regulatory-during.trycloudflare.com';
    const isHostedOnBackend = window.location.protocol.startsWith('http') && !window.location.hostname.includes('github.io');
    const sameOrigin = isHostedOnBackend ? window.location.origin : DEFAULT_TUNNEL;
    apiUrlInput.value = localStorage.getItem('silent_mt5_bookmap_url') || sameOrigin;

    let mode = 'mt5'; // 'mt5' | 'binance' | 'sim'
    let pollTimer = null;
    let simTimer = null;
    let ws = null;
    let isFetching = false;
    let lastSeq = 0;

    let priceRange = 14;
    let centerPrice = null;
    let autoCenter = true;
    let heatCap = 12;
    let needsRedraw = true;

    const DOM_WIDTH = 100;
    const AXIS_WIDTH = 72;
    const COL_WIDTH = 3;

    let currentLevels = [];
    let bestBid = 0;
    let bestAsk = 0;
    let history = [];
    let binBuyVol = 0;
    let binSellVol = 0;

    function markDirty() {
      needsRedraw = true;
    }

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      markDirty();
    }
    window.addEventListener('resize', resize);
    resize();

    function getHeatColor(ratio) {
      const t = Math.max(0, Math.min(1, ratio));
      if (t < 0.06) return null;
      if (t < 0.28) {
        const k = (t - 0.06) / 0.22;
        return `rgba(${Math.round(15 + 14 * k)}, ${Math.round(35 + 43 * k)}, ${Math.round(90 + 126 * k)}, ${0.42 + 0.4 * k})`;
      } else if (t < 0.52) {
        const k = (t - 0.28) / 0.24;
        return `rgba(${Math.round(29 - 23 * k)}, ${Math.round(78 + 104 * k)}, ${Math.round(216 - 4 * k)}, 0.88)`;
      } else if (t < 0.76) {
        const k = (t - 0.52) / 0.24;
        return `rgba(${Math.round(6 + 228 * k)}, ${Math.round(182 - 3 * k)}, ${Math.round(212 - 204 * k)}, 0.93)`;
      } else {
        const k = (t - 0.76) / 0.24;
        return `rgba(${Math.round(234 + 15 * k)}, ${Math.round(179 - 111 * k)}, ${Math.round(8 + 60 * k)}, 0.98)`;
      }
    }

    function setStatus(state, text) {
      statusDot.className = 'dot ' + (state || '');
      statusText.textContent = text;
    }

    function setActiveBtn(activeBtn) {
      [btnMT5, btnBinance, btnSim].forEach((b) => b.classList.remove('active'));
      activeBtn.classList.add('active');
    }

    function stopAll() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      if (simTimer) { clearInterval(simTimer); simTimer = null; }
      if (ws) { try { ws.close(); } catch (_) {} ws = null; }
    }

    function resetSeries() {
      history = [];
      currentLevels = [];
      centerPrice = null;
      lastSeq = 0;
      binBuyVol = 0;
      binSellVol = 0;
      markDirty();
    }

    function pushColumn(bid, ask, levels, buyBurst, sellBurst) {
      bestBid = bid;
      bestAsk = ask;
      currentLevels = levels;

      bidVal.textContent = bid.toFixed(2);
      askVal.textContent = ask.toFixed(2);
      spreadVal.textContent = (ask - bid).toFixed(2);

      const mid = (bid + ask) / 2;
      if (centerPrice === null) {
        centerPrice = mid;
      } else if (autoCenter && Math.abs(mid - centerPrice) > priceRange * 0.28) {
        centerPrice += (mid - centerPrice) * 0.08;
      }

      history.push({
        bid,
        ask,
        levels,
        buyVol: buyBurst,
        sellVol: sellBurst
      });

      const rect = canvas.parentElement.getBoundingClientRect();
      const chartW = Math.max(100, rect.width - DOM_WIDTH - AXIS_WIDTH);
      const maxCols = Math.ceil(chartW / COL_WIDTH) + 5;
      if (history.length > maxCols) {
        history.splice(0, history.length - maxCols);
      }
      markDirty();
    }

    function startMT5() {
      stopAll();
      if (mode !== 'mt5') resetSeries();
      mode = 'mt5';
      setActiveBtn(btnMT5);
      legendLabel.textContent = 'Liquidity Pool (Swing + Round + Tick)';

      const baseUrl = (apiUrlInput.value.trim() || sameOrigin).replace(/\/+$/, '');
      localStorage.setItem('silent_mt5_bookmap_url', baseUrl);
      const baseEndpoint = baseUrl.endsWith('/api/bookmap') ? baseUrl : baseUrl + '/api/bookmap';

      setStatus('', 'Đang kết nối MT5...');

      pollTimer = setInterval(async () => {
        if (isFetching) return;
        isFetching = true;
        try {
          const url = `${baseEndpoint}?since_seq=${lastSeq}`;
          const res = await fetch(url, { cache: 'no-store' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();

          if (data.status === 'live' && data.bid > 0) {
            symBadge.textContent = `${data.symbol} • MT5 SYNTHETIC`;
            setStatus('live', 'LIVE MT5');
            if (data.seq !== lastSeq) {
              lastSeq = data.seq || lastSeq + 1;
              pushColumn(data.bid, data.ask, data.levels || [], data.buy_burst || 0, data.sell_burst || 0);
            }
          } else {
            setStatus('err', 'MT5: ' + (data.status || 'waiting'));
          }
        } catch (err) {
          setStatus('err', 'Mất kết nối Server / MT5');
        } finally {
          isFetching = false;
        }
      }, 200);
    }

    function startBinance() {
      stopAll();
      if (mode !== 'binance') resetSeries();
      mode = 'binance';
      setActiveBtn(btnBinance);
      symBadge.textContent = 'PAXGUSDT • BINANCE DEPTH20';
      legendLabel.textContent = 'Order Book Depth (Binance PAXG)';
      setStatus('', 'Đang kết nối Binance...');

      const url = 'wss://data-stream.binance.vision/stream?streams=paxgusdt@depth20@100ms/paxgusdt@aggTrade';
      ws = new WebSocket(url);

      ws.onopen = () => setStatus('live', 'LIVE BINANCE');
      ws.onerror = () => setStatus('err', 'Lỗi WebSocket Binance');
      ws.onclose = () => {
        if (mode === 'binance') setStatus('err', 'Ngắt kết nối Binance');
      };

      ws.onmessage = (ev) => {
        try {
          const msg = JSON.parse(ev.data);
          if (!msg || !msg.data) return;
          if (msg.stream.endsWith('@aggTrade')) {
            const qty = parseFloat(msg.data.q) || 0;
            if (msg.data.m) binSellVol += qty * 8;
            else binBuyVol += qty * 8;
          } else if (msg.stream.endsWith('@depth20@100ms')) {
            const bids = msg.data.bids || [];
            const asks = msg.data.asks || [];
            if (!bids.length || !asks.length) return;
            const bid = parseFloat(bids[0][0]);
            const ask = parseFloat(asks[0][0]);
            const levels = [];
            for (const [p, q] of bids) levels.push([parseFloat(p), parseFloat(q) * 3]);
            for (const [p, q] of asks) levels.push([parseFloat(p), parseFloat(q) * 3]);
            pushColumn(bid, ask, levels, binBuyVol, binSellVol);
            binBuyVol = 0;
            binSellVol = 0;
          }
        } catch (_) {}
      };
    }

    function startSim() {
      stopAll();
      if (mode !== 'sim') resetSeries();
      mode = 'sim';
      setActiveBtn(btnSim);
      symBadge.textContent = 'XAUUSD • DEMO SIM';
      legendLabel.textContent = 'Simulated Liquidity Pools';
      setStatus('live', 'SIMULATION');

      let simPrice = centerPrice || 3718.00;
      const wallTop = Math.round(simPrice) + 4.0;
      const wallBot = Math.round(simPrice) - 3.5;

      simTimer = setInterval(() => {
        const delta = (Math.random() - 0.5) * 0.55;
        simPrice += delta;
        const bid = +(simPrice - 0.12).toFixed(2);
        const ask = +(simPrice + 0.12).toFixed(2);

        const levels = [];
        const base = Math.round(simPrice * 2) / 2;
        for (let k = -24; k <= 24; k++) {
          const p = +(base + k * 0.5).toFixed(2);
          let h = (p % 5 === 0) ? 5.5 : (p % 1 === 0 ? 2.4 : 0.9);
          if (Math.abs(p - wallTop) < 0.6) h += 7.5;
          if (Math.abs(p - wallBot) < 0.6) h += 7.0;
          levels.push([p, h]);
        }

        const buyBurst = delta > 0.12 ? +(delta * 16).toFixed(2) : 0;
        const sellBurst = delta < -0.12 ? +(-delta * 16).toFixed(2) : 0;
        pushColumn(bid, ask, levels, buyBurst, sellBurst);
      }, 180);
    }

    function priceToY(price, height) {
      const topPrice = centerPrice + priceRange / 2;
      return ((topPrice - price) / priceRange) * height;
    }

    function drawFrame() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const W = rect.width;
      const H = rect.height;
      const chartW = W - DOM_WIDTH - AXIS_WIDTH;

      ctx.fillStyle = '#070b12';
      ctx.fillRect(0, 0, W, H);

      if (centerPrice === null) {
        ctx.fillStyle = '#64748b';
        ctx.font = '14px sans-serif';
        ctx.fillText('Đang chờ dữ liệu từ MT5 / Bridge (hoặc bấm "Binance PAXG" / "Demo Sim")...', 20, 40);
        return;
      }

      // 1. Lưới giá ngang
      const step = priceRange <= 6 ? 0.5 : priceRange <= 20 ? 1 : priceRange <= 50 ? 2 : 5;
      const minP = centerPrice - priceRange / 2;
      const maxP = centerPrice + priceRange / 2;
      const firstTick = Math.ceil(minP / step) * step;

      ctx.strokeStyle = 'rgba(148, 163, 184, 0.08)';
      ctx.lineWidth = 1;
      ctx.font = '11px ui-monospace, monospace';
      ctx.fillStyle = '#94a3b8';

      for (let p = firstTick; p <= maxP; p += step) {
        const y = priceToY(p, H);
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(chartW + DOM_WIDTH, y);
        ctx.stroke();
        ctx.fillText(p.toFixed(2), chartW + DOM_WIDTH + 8, y + 4);
      }

      // 2. Vẽ Heatmap
      const bandH = Math.max(4, (H / priceRange) * 0.5);
      const startX = chartW - history.length * COL_WIDTH;

      for (let i = 0; i < history.length; i++) {
        const col = history[i];
        const x = startX + i * COL_WIDTH;
        if (x + COL_WIDTH < 0) continue;

        for (let j = 0; j < col.levels.length; j++) {
          const [p, h] = col.levels[j];
          const y = priceToY(p, H);
          if (y < -bandH || y > H + bandH) continue;
          const color = getHeatColor(h / heatCap);
          if (!color) continue;
          ctx.fillStyle = color;
          ctx.fillRect(x, y - bandH / 2, COL_WIDTH + 0.5, bandH);
        }
      }

      // 3. Đường Best Bid & Best Ask
      if (history.length > 1) {
        ctx.lineWidth = 1.6;
        ctx.strokeStyle = '#22c55e';
        ctx.beginPath();
        for (let i = 0; i < history.length; i++) {
          const x = startX + i * COL_WIDTH;
          const y = priceToY(history[i].bid, H);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();

        ctx.strokeStyle = '#ef4444';
        ctx.beginPath();
        for (let i = 0; i < history.length; i++) {
          const x = startX + i * COL_WIDTH;
          const y = priceToY(history[i].ask, H);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      // 4. Bong bóng Buy / Sell Burst
      for (let i = 0; i < history.length; i++) {
        const col = history[i];
        const x = startX + i * COL_WIDTH;

        if (col.buyVol > 0.5) {
          const r = Math.min(20, Math.max(3.5, Math.sqrt(col.buyVol) * 3.8));
          const y = priceToY(col.ask, H);
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(34, 197, 94, 0.42)';
          ctx.fill();
          ctx.strokeStyle = '#4ade80';
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }
        if (col.sellVol > 0.5) {
          const r = Math.min(20, Math.max(3.5, Math.sqrt(col.sellVol) * 3.8));
          const y = priceToY(col.bid, H);
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(239, 68, 68, 0.42)';
          ctx.fill();
          ctx.strokeStyle = '#f87171';
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }
      }

      // 5. Cột Synthetic Liquidity DOM bên phải
      ctx.fillStyle = '#0b1220';
      ctx.fillRect(chartW, 0, DOM_WIDTH, H);
      ctx.strokeStyle = '#1e293b';
      ctx.beginPath();
      ctx.moveTo(chartW, 0); ctx.lineTo(chartW, H);
      ctx.moveTo(chartW + DOM_WIDTH, 0); ctx.lineTo(chartW + DOM_WIDTH, H);
      ctx.stroke();

      const mid = (bestBid + bestAsk) / 2;
      for (const [p, h] of currentLevels) {
        const y = priceToY(p, H);
        if (y < 0 || y > H) continue;
        const barW = Math.min(DOM_WIDTH - 6, (h / heatCap) * (DOM_WIDTH - 10));
        ctx.fillStyle = p >= mid ? 'rgba(239, 68, 68, 0.65)' : 'rgba(34, 197, 94, 0.65)';
        ctx.fillRect(chartW + 2, y - 3, barW, 6);
      }

      // 6. Nhãn giá hiện tại
      const midY = priceToY(mid, H);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(chartW + DOM_WIDTH + 2, midY - 9, AXIS_WIDTH - 4, 18);
      ctx.fillStyle = '#070b12';
      ctx.font = 'bold 11px monospace';
      ctx.fillText(mid.toFixed(2), chartW + DOM_WIDTH + 8, midY + 4);
    }

    function renderLoop() {
      if (needsRedraw) {
        needsRedraw = false;
        drawFrame();
      }
      requestAnimationFrame(renderLoop);
    }

    btnMT5.onclick = startMT5;
    btnBinance.onclick = startBinance;
    btnSim.onclick = startSim;
    btnCenter.onclick = () => {
      if (bestBid && bestAsk) centerPrice = (bestBid + bestAsk) / 2;
      autoCenter = true;
      markDirty();
    };
    btnClear.onclick = () => { history = []; markDirty(); };
    zoomIn.onclick = () => { priceRange = Math.max(3, priceRange * 0.75); markDirty(); };
    zoomOut.onclick = () => { priceRange = Math.min(80, priceRange * 1.35); markDirty(); };
    heatRange.oninput = (e) => { heatCap = parseFloat(e.target.value); markDirty(); };

    let isDragging = false, lastY = 0;
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      priceRange = e.deltaY > 0
        ? Math.min(80, priceRange * 1.12)
        : Math.max(3, priceRange * 0.88);
      markDirty();
    }, { passive: false });

    canvas.addEventListener('mousedown', (e) => { isDragging = true; lastY = e.clientY; autoCenter = false; });
    window.addEventListener('mouseup', () => { isDragging = false; });
    window.addEventListener('mousemove', (e) => {
      if (!isDragging || centerPrice === null) return;
      const dy = e.clientY - lastY;
      lastY = e.clientY;
      const H = canvas.parentElement.getBoundingClientRect().height;
      centerPrice += (dy / H) * priceRange;
      markDirty();
    });

    startMT5();
    requestAnimationFrame(renderLoop);
  </script>
</body>
</html>
